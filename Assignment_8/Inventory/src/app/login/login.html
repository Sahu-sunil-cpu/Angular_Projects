<div class="login-container">
    <div class="login-card">
        <h1>Inventory Management</h1>
        <p class="subtitle">Login to your account</p>

        <form (ngSubmit)="login()">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" type="text" name="username" [(ngModel)]="username" placeholder="Enter username"
                    required />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" [(ngModel)]="password" placeholder="Enter password"
                    required />
            </div>

            <button type="submit">Login</button>
        </form>

        <p class="demo-credentials">
            Demo username: <strong>admin</strong><br />
            Demo password: <strong>admin123</strong>
        </p>
    </div>
</div>
