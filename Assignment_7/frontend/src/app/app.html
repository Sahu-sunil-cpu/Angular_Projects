<div class="container">
  <h1>Product Management</h1>

  <button (click)="addProduct()">Add Product</button>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Product Name</th>
        <th>Price</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let product of products">
        <td>{{ product.id }}</td>
        <td>{{ product.name }}</td>
        <td>₹{{ product.price }}</td>

        <td>
          <button (click)="updateProduct(product.id)">
            Update Price
          </button>

          <button (click)="deleteProduct(product.id)">
            Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
