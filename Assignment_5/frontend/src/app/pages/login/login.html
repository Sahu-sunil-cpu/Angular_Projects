<section class="login-page">
    <div class="login-card">
        <div class="login-logo">E</div>

        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to your EmployeeHub account.</p>

        <form (ngSubmit)="onSubmit()">
            <label for="email">Email Address</label>
            <input id="email" type="email" name="email" [(ngModel)]="email" placeholder="you@example.com" required />

            <label for="password">Password</label>
            <input id="password" type="password" name="password" [(ngModel)]="password"
                placeholder="Enter your password" required />

            <button type="submit">Sign In</button>
        </form>

        <p *ngIf="message" class="message">{{ message }}</p>

        <p class="footer-text">EmployeeHub · Employee Management System</p>
    </div>
</section>
